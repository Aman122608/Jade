name: Build Jade IPA

# Builds ad-hoc signed Jade.ipa + Jade-MHA.ipa on a macOS runner.
# Unsigned/ad-hoc IPAs install via TrollStore or a paid developer certificate
# (see README → Installation).

on:
  push:
    branches: [main, crash-handler]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 (Intel) ships Xcode 26.3 with the iOS 26.2 SDK; the project needs
    # iOS 26.0+, and macos-26's arm64 pool is badly capacity constrained.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode builds:"
          ls -d /Applications/Xcode*.app || true

          BEST_VER=""
          BEST_PATH=""
          for app in /Applications/Xcode*.app; do
            base="$(basename "$app")"
            ver="$(printf '%s' "$base" | sed -E 's#^Xcode_?##; s#\.app$##')"
            case "$ver" in
              ""|*[!0-9.]*) continue ;;
            esac
            if [ -z "$BEST_VER" ] \
               || [ "$(printf '%s\n%s\n' "$BEST_VER" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              BEST_VER="$ver"
              BEST_PATH="$app"
            fi
          done

          if [ -z "$BEST_PATH" ]; then
            echo "No versioned Xcode found, falling back to the default install"
            BEST_PATH="/Applications/Xcode.app"
          fi

          echo "Selecting Xcode ${BEST_VER} at ${BEST_PATH}"
          sudo xcode-select -s "${BEST_PATH}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "DEVELOPER_DIR=${BEST_PATH}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build & package IPAs
        env:
          # dSYMs so backtraces from the crash handler can be symbolized later.
          EXTRA_XCODEBUILD_ARGS: "DEBUG_INFORMATION_FORMAT=dwarf-with-dsym"
        run: |
          set -uo pipefail
          chmod +x build_ipa.sh
          if ./build_ipa.sh; then
            echo "ICON_COMPOSER=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          if grep -q 'JadeIcon.icon' build/build.log; then
            # actool on this Xcode build cannot compile the Icon Composer bundle
            # (see repo notes). Fall back to the flat AppIcon asset so the IPA
            # still ships with an icon.
            echo "::warning::Icon Composer bundle failed to compile; rebuilding with the flat AppIcon asset"
            mv bad_query/JadeIcon.icon "${RUNNER_TEMP}/JadeIcon.icon"
            EXTRA_XCODEBUILD_ARGS="DEBUG_INFORMATION_FORMAT=dwarf-with-dsym ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon" \
              ./build_ipa.sh
            echo "ICON_COMPOSER=no" >> "$GITHUB_ENV"
          else
            exit 1
          fi

      - name: Collect dSYMs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/symbols
          find build/DerivedData/Build/Products -name '*.dSYM' -maxdepth 4 \
            -exec cp -R {} build/symbols/ \; 2>/dev/null || true
          ls -R build/symbols || true

      - name: Show build log tail
        if: always()
        run: tail -n 120 build/build.log || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: build/*.ipa
          if-no-files-found: error

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jade-dSYM
          path: build/symbols
          if-no-files-found: warn

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jade-build-log
          path: build/build.log
          if-no-files-found: warn

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jade build #${{ github.run_number }}
          body: |
            Auto-built from `${{ github.sha }}` on Xcode (iOS 26 SDK).

            | IPA | Bundle ID | Use |
            |-----|-----------|-----|
            | `Jade.ipa` | `com.jason.Jade` | Standard bad_query escape |
            | `Jade-MHA.ipa` | `com.apple.mobile.MobileHouseArrest` | Full container access (TrollStore / paid cert only) |

            Ad-hoc signed. Crash logs land in the app's `Documents/JadeCrashLogs`
            and are reachable from Settings → Diagnostics → Crash Logs.
          files: |
            build/Jade.ipa
            build/Jade-MHA.ipa
          prerelease: true
