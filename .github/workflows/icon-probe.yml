name: Icon Probe (temporary)

on:
  push:
    branches: [crash-handler]
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.0.app/Contents/Developer

      - name: Bisect icon.json
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, shutil, subprocess, pathlib

          assets = "bad_query/Assets.xcassets"
          real_icon = pathlib.Path("bad_query/JadeIcon.icon")
          base = json.loads((real_icon / "icon.json").read_text(encoding="utf-8-sig"))

          crafted = {
              "fill": {"linear-gradient": [
                  "srgb:0.40745,0.86382,0.48257,1.00000",
                  "srgb:0.00000,0.69226,0.20495,1.00000",
              ]},
              "groups": [
                  {
                      "layers": [{
                          "image-name": "\u9020\u578b2 (1).svg",
                          "name": "\u9020\u578b2 (1)",
                          "position": {"scale": 9, "translation-in-points": [0, 0]},
                      }],
                      "shadow": {"kind": "neutral", "opacity": 0.9},
                      "specular": False,
                      "translucency": {"enabled": False, "value": 0.5},
                  },
                  {
                      "layers": [{
                          "image-name": "\u9020\u578b4.svg",
                          "name": "\u9020\u578b4",
                          "position": {"scale": 10, "translation-in-points": [0, 1]},
                      }],
                      "shadow": {"kind": "neutral", "opacity": 0.3},
                      "specular": False,
                      "translucency": {"enabled": False, "value": 0.5},
                  },
              ],
          }

          def with_p3(d):
              d = json.loads(json.dumps(d))
              d["color-space-for-untagged-svg-colors"] = "display-p3"
              return d

          def crafted_with_heic(d):
              d = json.loads(json.dumps(d))
              d["groups"].append({
                  "layers": [{
                      "image-name": "HEIF\u56fe\u50cf.heic",
                      "name": "HEIF\u56fe\u50cf",
                      "position": {"scale": 1.2, "translation-in-points": [18, -14]},
                  }],
                  "shadow": {"kind": "layer-color", "opacity": 0.6},
                  "specular": False,
                  "translucency": {"enabled": False, "value": 0.5},
              })
              return d

          def base_without_heic(d):
              d = json.loads(json.dumps(d))
              d["groups"] = [g for g in d["groups"]
                             if not any(l.get("image-name", "").startswith("HEIF") for l in g.get("layers", []))]
              return d

          variants = {
              "A_crafted": crafted,
              "B_crafted_p3": with_p3(crafted),
              "C_crafted_heic": crafted_with_heic(crafted),
              "D_base_no_heic": base_without_heic(base),
          }

          def run(tag, data):
              work = pathlib.Path(f"/tmp/icons4/{tag}")
              if work.exists():
                  shutil.rmtree(work)
              work.mkdir(parents=True)
              dst = work / "JadeIcon.icon"
              shutil.copytree(real_icon, dst)
              (dst / "icon.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
              out = work / "out"
              out.mkdir()
              cmd = [
                  "xcrun", "actool", assets, str(dst),
                  "--compile", str(out),
                  "--output-format", "human-readable-text",
                  "--notices", "--warnings",
                  "--export-dependency-info", str(work / "deps"),
                  "--output-partial-info-plist", str(work / "partial.plist"),
                  "--app-icon", "JadeIcon",
                  "--include-all-app-icons",
                  "--accent-color", "AccentColor",
                  "--compress-pngs",
                  "--enable-on-demand-resources", "YES",
                  "--development-region", "en",
                  "--target-device", "iphone", "--target-device", "ipad",
                  "--minimum-deployment-target", "26.0",
                  "--platform", "iphoneos",
                  "--bundle-identifier", "com.jason.Jade",
              ]
              r = subprocess.run(cmd, capture_output=True, text=True)
              status = "OK" if r.returncode == 0 else f"FAIL({r.returncode})"
              print(f"\n===== {tag}: {status} =====")
              for line in ((r.stdout or "") + (r.stderr or "")).strip().splitlines()[-6:]:
                  print("   ", line)
              pngs = sorted(p.name for p in out.rglob("*.png"))
              print("    png outputs:", pngs[:8])

          for tag, data in variants.items():
              run(tag, data)
          PY
