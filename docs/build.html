<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jade Build">
<meta name="theme-color" content="#0b1410">
<title>Jade Build</title>
<style>
  :root { color-scheme: dark; --bg:#0b1410; --card:#12211a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 40px;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #16301f 0%, #0b1410 55%);
    color: #e8f5ec; min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: .2px; }
  .sub { color: #7ea28d; font-size: 13px; margin: 0 0 18px; }
  .card { background: #12211a; border: 1px solid #1e3528; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: #7ea28d; margin-bottom: 8px; }
  input[type=password], input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid #24402f;
    background: #0d1a13; color: #e8f5ec; font: 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  button {
    width: 100%; padding: 16px; margin-top: 12px; border: 0; border-radius: 14px;
    font: 600 17px/1 -apple-system, system-ui, sans-serif; color: #06120b;
    background: linear-gradient(180deg, #68dc7b, #00b134);
  }
  button:disabled { opacity: .45; }
  button.ghost { background: #16281d; color: #c9e6d3; border: 1px solid #24402f; font-weight: 500; font-size: 15px; padding: 13px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4b6b58; flex: 0 0 auto; }
  .dot.queued { background: #d9a441; }
  .dot.running { background: #4aa8ff; animation: pulse 1.4s infinite; }
  .dot.ok { background: #35d06a; }
  .dot.bad { background: #ff5a5a; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .steps { margin: 12px 0 0; padding: 0; list-style: none; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .steps li { display: flex; gap: 8px; padding: 3px 0; color: #86a895; }
  .steps li .m { width: 14px; flex: 0 0 14px; text-align: center; }
  .steps li.done { color: #b9dcc6; }
  .steps li.done .m { color: #35d06a; }
  .steps li.fail { color: #ffb3b3; }
  .steps li.fail .m { color: #ff5a5a; }
  .steps li.active { color: #e8f5ec; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1a13; padding: 2px 6px; border-radius: 6px; }
  .hint { color: #6d8f7b; font-size: 12.5px; margin-top: 10px; }
  a { color: #7fe39c; }
  .meta { font-size: 12.5px; color: #7ea28d; margin-top: 10px; }
  .download { display: block; text-align: center; text-decoration: none; padding: 16px; border-radius: 14px;
    background: #16301f; border: 1px solid #2c5a3f; color: #b8f0c9; font-weight: 600; margin-top: 10px; }
  .download + .download { margin-top: 8px; }
.notes { max-height: 420px; overflow-y: auto; padding-right: 6px; }
  .notes h2, .notes h3 { font-size: 15px; margin: 18px 0 6px; }
  .notes h3:first-child { margin-top: 4px; }
  .notes h4 { font-size: 13px; margin: 12px 0 4px; color: #9d948b; }
  .notes p { margin: 6px 0; font-size: 13px; }
  .notes ul { margin: 6px 0 6px 18px; }
  .notes li { font-size: 13px; margin: 3px 0; border: 0; padding: 0; display: list-item; }
  .notes code { font-size: 12px; }
</style>
</head>
<body>
  <h1>Jade Build</h1>
  <p class="sub">Triggers the Xcode build on GitHub Actions and hands back the IPA.</p>

  <div class="card" id="tokenCard">
    <label for="pat">GitHub token (repo + workflow scope)</label>
    <input id="pat" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false">
    <button id="save">Save token on this device</button>
    <p class="hint">Stored in this browser's localStorage only. Fine-grained token needs <code>Actions: read/write</code> and <code>Contents: read/write</code> on Aman122608/Jade.</p>
  </div>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Idle</span></div>
    <ul class="steps" id="steps"></ul>
    <div class="row">
      <button id="build">Build Jade.ipa</button>
    </div>
    <div class="row">
      <button class="ghost" id="refresh">Refresh status</button>
      <button class="ghost" id="openGh">Open run on GitHub</button>
    </div>
    <p class="meta" id="meta"></p>
  </div>

  <div class="card">
    <label>Latest release IPAs (no token needed)</label>
    <div id="releases"><p class="hint">Loading…</p></div>

    <label>Release notes — what changed, and what to check</label>
    <div id="notes"><p class="hint">Loading…</p></div>

    <label>Wandering builds (no token needed)</label>
    <div id="wandering"><p class="hint">Loading…</p></div>
  </div>

<script>
const REPO = "Aman122608/Jade";
const WORKFLOW = "build-jade.yml";
const REF = "main";
const API = "https://api.github.com";

const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("jade_pat") || "";
let timer = null;
let currentRun = null;

function setStatus(kind, text) {
  $("dot").className = "dot " + kind;
  $("statusText").textContent = text;
}

function renderSteps(jobs) {
  const ul = $("steps");
  ul.innerHTML = "";
  if (!jobs || !jobs.length) return;
  for (const job of jobs) {
    for (const step of job.steps || []) {
      const li = document.createElement("li");
      let mark = "·", cls = "";
      if (step.status === "completed") {
        if (step.conclusion === "success") { mark = "✓"; cls = "done"; }
        else if (step.conclusion === "skipped") { mark = "–"; }
        else { mark = "✕"; cls = "fail"; }
      } else if (step.status === "in_progress") { mark = "▸"; cls = "active"; }
      li.className = cls;
      li.innerHTML = `<span class="m">${mark}</span><span>${step.name}</span>`;
      ul.appendChild(li);
    }
  }
}

async function api(path, opts = {}) {
  const headers = {
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    ...(opts.headers || {}),
  };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API + path, { ...opts, headers });
  if (!res.ok) throw new Error(res.status + " " + (await res.text()).slice(0, 200));
  return res.status === 204 ? null : res.json();
}

async function startBuild() {
  if (!token) { setStatus("bad", "Add a token first"); return; }
  $("build").disabled = true;
  try {
    setStatus("queued", "Dispatching workflow…");
    await api(`/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: REF }),
    });
    setStatus("running", "Queued — GitHub is picking a macOS runner");
    await new Promise((r) => setTimeout(r, 4000));
    poll();
  } catch (e) {
    setStatus("bad", "Dispatch failed: " + e.message);
    $("build").disabled = false;
  }
}

async function poll() {
  clearTimeout(timer);
  if (!token) return;
  try {
    const runs = await api(`/repos/${REPO}/actions/runs?branch=${REF}&per_page=5`);
    const run = runs.workflow_runs.find((r) => r.path.endsWith(WORKFLOW)) || runs.workflow_runs[0];
    if (!run) { setStatus("", "No runs yet"); $("build").disabled = false; return; }
    currentRun = run;

    if (run.status === "completed") {
      const ok = run.conclusion === "success";
      setStatus(ok ? "ok" : "bad", ok ? "Build finished — IPA ready" : "Build failed (" + run.conclusion + ")");
      $("build").disabled = false;
    } else if (run.status === "in_progress") {
      setStatus("running", "Building on macOS runner…");
    } else {
      setStatus("queued", "Queued" + (run.status === "waiting" ? " (waiting for approval)" : " — waiting for a macOS runner"));
    }

    $("meta").textContent = `run #${run.run_number} · ${run.head_branch} · ${new Date(run.created_at).toLocaleString()}`;

    const jobs = await api(`/repos/${REPO}/actions/runs/${run.id}/jobs`);
    renderSteps(jobs.jobs);

    if (run.status !== "completed") timer = setTimeout(poll, 12000);
    else loadReleases();
loadWandering();
loadNotes();
  } catch (e) {
    setStatus("bad", "Poll failed: " + e.message);
    $("build").disabled = false;
  }
}

async function loadReleases() {
  try {
    const rels = await api(`/repos/${REPO}/releases?per_page=3`);
    const box = $("releases");
    if (!rels.length) { box.innerHTML = '<p class="hint">No releases yet.</p>'; return; }
    box.innerHTML = "";
    for (const rel of rels) {
      const head = document.createElement("p");
      head.className = "meta";
      head.textContent = rel.name + " · " + new Date(rel.published_at).toLocaleDateString();
      box.appendChild(head);
      for (const a of rel.assets) {
        const link = document.createElement("a");
        link.className = "download";
        link.href = a.browser_download_url;
        link.textContent = `${a.name} · ${(a.size / 1048576).toFixed(1)} MB`;
        box.appendChild(link);
      }
    }
  } catch (e) {
    $("releases").innerHTML = '<p class="hint">Could not load releases: ' + e.message + "</p>";
  }
}

const WANDERING_REPO = "Aman122608/wandering";
const NOTES_URL = `https://raw.githubusercontent.com/${WANDERING_REPO}/main/RELEASES.md`;

// Deliberately tiny: headings, bold, inline code, bullets, paragraphs. Enough for
// release notes, and no dependency to break.
function renderMarkdown(text) {
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  const out = [];
  let list = false;
  const closeList = () => { if (list) { out.push("</ul>"); list = false; } };

  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { closeList(); continue; }
    if (/^###\s/.test(line)) { closeList(); out.push(`<h4>${inline(line.slice(4))}</h4>`); }
    else if (/^##\s/.test(line)) { closeList(); out.push(`<h3>${inline(line.slice(3))}</h3>`); }
    else if (/^#\s/.test(line)) { closeList(); out.push(`<h2>${inline(line.slice(2))}</h2>`); }
    else if (/^[-*]\s/.test(line)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push(`<li>${inline(line.replace(/^[-*]\s+/, ""))}</li>`);
    } else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList();
  return out.join("");
}

async function loadNotes() {
  const box = $("notes");
  try {
    const res = await fetch(NOTES_URL + "?v=" + Date.now());
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const text = await res.text();
    box.innerHTML = '<div class="notes">' + renderMarkdown(text) + "</div>";
  } catch (e) {
    box.innerHTML = '<p class="hint">Could not load release notes: ' + e.message
      + ' — open <a href="' + NOTES_URL + '">RELEASES.md</a>.</p>';
  }
}

async function loadWandering() {
  const box = $("wandering");
  try {
    const res = await fetch(
      `https://api.github.com/repos/${WANDERING_REPO}/releases?per_page=30`,
      { headers: { Accept: "application/vnd.github+json" } }
    );
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const rels = await res.json();
    // The API does not order these by date (releases published from CI come back
    // in tag order), so sort explicitly and keep the newest few.
    const stamp = r => new Date(r.published_at || r.created_at).getTime();
    const withIpa = rels
      .filter(r => r.assets.some(a => a.name.endsWith(".ipa")))
      .sort((a, b) => stamp(b) - stamp(a))
      .slice(0, 6);
    if (!withIpa.length) {
      box.innerHTML = '<p class="hint">No Wandering builds published yet.</p>';
      return;
    }
    box.innerHTML = "";
    for (const rel of withIpa) {
      const head = document.createElement("p");
      head.className = "meta";
      const when = new Date(rel.published_at).toLocaleString();
      head.textContent = `${rel.tag_name} · ${when}` + (rel.prerelease ? " · pre-release" : "");
      box.appendChild(head);
      for (const a of rel.assets) {
        if (!a.name.endsWith(".ipa")) continue;
        const link = document.createElement("a");
        link.className = "download";
        link.href = a.browser_download_url;
        link.textContent = `${a.name} · ${(a.size / 1048576).toFixed(2)} MB`;
        box.appendChild(link);
      }
    }
  } catch (e) {
    box.innerHTML = '<p class="hint">Could not load Wandering builds: '
      + e.message + "</p>";
  }
}

$("save").onclick = () => {
  const v = $("pat").value.trim();
  if (!v) return;
  token = v;
  localStorage.setItem("jade_pat", v);
  $("pat").value = "";
  setStatus("", "Token saved");
  poll();
  loadReleases();
loadWandering();
loadNotes();
};
$("build").onclick = startBuild;
$("refresh").onclick = poll;
$("openGh").onclick = () => {
  const url = currentRun ? currentRun.html_url : `https://github.com/${REPO}/actions`;
  window.open(url, "_blank");
};

if (token) { poll(); } else { setStatus("", "Add a token to start"); }
loadReleases();
loadWandering();
loadNotes();
</script>
</body>
</html>
